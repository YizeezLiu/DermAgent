# DermAgent Benchmark Configuration
# 实验配置文件

# ===========================================
# 全局设置
# ===========================================
global:
  seed: 42
  device: "cuda"
  output_dir: "results/benchmark"
  log_dir: "logs/benchmark"
  save_predictions: true
  num_runs: 1  # 每个实验运行次数（建议3次取平均）

# ===========================================
# 服务器环境设置
# ===========================================
server:
  cuda_visible_devices: "0"  # 指定使用的GPU，多个用逗号分隔: "0,1"
  check_gpu_before_run: true
  max_gpu_memory_gb: 40  # 最大使用GPU内存（GB）
  enable_quantization: true  # 启用模型量化以节省内存
  quantization_bits: 8  # 4 or 8

# ===========================================
# 模型配置
# ===========================================
models:
  # =============================================
  # 专用模型 (特定任务) - OpenCLIP 架构
  # =============================================
  dermlip:
    name: "DermLIP"
    hf_model_id: "redlessone/DermLIP_PanDerm-base-w-PubMed-256"
    local_path: "/mnt/hdd/sdb/yizeliu/DermAgent/model-weights/dermlip"
    model_type: "open_clip"
    # Vision Config
    vision_cfg:
      image_size: 224
      layers: 12
      width: 768
      patch_size: 16
    # Text Config
    text_cfg:
      context_length: 256
      hf_model_name: "neuml/pubmedbert-base-embeddings"
      hf_tokenizer_name: "neuml/pubmedbert-base-embeddings"
      hf_pooler_type: "mean_pooler"
    embed_dim: 512
    preprocess:
      mean: [0.48145466, 0.4578275, 0.40821073]
      std: [0.26862954, 0.26130258, 0.27577711]
    device: "cuda"
    batch_size: 64
    tasks: [1]  # 只参与 Task 1: Zero-shot Classification
    downloaded: true
    
  make:
    name: "MAKE"
    hf_model_id: "xieji-x/MAKE"
    local_path: "/mnt/hdd/sdb/yizeliu/DermAgent/model-weights/make"
    model_type: "open_clip"
    # Vision Config
    vision_cfg:
      image_size: 224
      layers: 12
      width: 768
      patch_size: 16
    # Text Config
    text_cfg:
      context_length: 77
      vocab_size: 49408
      width: 512
      heads: 8
      layers: 12
    embed_dim: 512
    preprocess:
      mean: [0.48145466, 0.4578275, 0.40821073]
      std: [0.26862954, 0.26130258, 0.27577711]
    device: "cuda"
    batch_size: 32
    tasks: [2]  # 只参与 Task 2: Concept Annotation
    downloaded: true
    
  # =============================================
  # MLLM 模型 (多任务)
  # =============================================
  llava_med:
    name: "LLaVA-Med"
    hf_model_id: "microsoft/llava-med-v1.5-mistral-7b"
    local_path: "/mnt/hdd/sdb/yizeliu/DermAgent/model-weights/llava_med"
    model_type: "llava_mistral"
    architectures: ["LlavaMistralForCausalLM"]
    # LLM Config
    llm_backbone: "mistralai/Mistral-7B-Instruct-v0.2"
    hidden_size: 4096
    num_hidden_layers: 32
    num_attention_heads: 32
    vocab_size: 32000
    # Vision Config
    mm_vision_tower: "openai/clip-vit-large-patch14-336"
    vision_backbone: "convnextlarge"
    mm_hidden_size: 1024
    mm_projector_type: "mlp2x_gelu"
    img_size: 640
    # Inference Config
    torch_dtype: "bfloat16"
    tokenizer_model_max_length: 2048
    device: "cuda"
    load_in_8bit: true
    batch_size: 8
    max_new_tokens: 512
    temperature: 0.7
    top_p: 0.95
    tasks: [1, 2, 3, 4]
    downloaded: true
    
  huatuo_gpt:
    name: "HuatuoGPT-Vision-7B"
    hf_model_id: "FreedomIntelligence/HuatuoGPT-Vision-7B"
    local_path: "/mnt/hdd/sdb/yizeliu/DermAgent/model-weights/huatuo_gpt"
    model_type: "llava_qwen2"
    architectures: ["LlavaQwen2ForCausalLM"]
    # LLM Config (Qwen2-based)
    hidden_size: 3584
    num_hidden_layers: 28
    num_attention_heads: 28
    num_key_value_heads: 4
    vocab_size: 152064
    # Vision Config
    mm_vision_tower: "./vit/clip_vit_large_patch14_336"
    mm_hidden_size: 1024
    mm_projector_type: "mlp2x_gelu"
    # Inference Config
    torch_dtype: "bfloat16"
    tokenizer_model_max_length: 4096
    device: "cuda"
    load_in_8bit: true
    batch_size: 8
    max_new_tokens: 512
    temperature: 0.7
    top_p: 0.95
    tasks: [1, 2, 3, 4]
    downloaded: true
    
  qwen_vl:
    name: "Qwen3-VL-8B-Instruct"
    hf_model_id: "Qwen/Qwen3-VL-8B-Instruct"
    local_path: "/mnt/hdd/sdb/yizeliu/DermAgent/model-weights/qwen_vl"
    model_type: "qwen3_vl"
    architectures: ["Qwen3VLForConditionalGeneration"]
    # Text/LLM Config
    text_config:
      hidden_size: 4096
      num_hidden_layers: 36
      num_attention_heads: 32
      num_key_value_heads: 8
      vocab_size: 151936
      max_position_embeddings: 262144
      head_dim: 128
    # Vision Config
    vision_config:
      depth: 27
      hidden_size: 1152
      num_heads: 16
      patch_size: 16
      spatial_merge_size: 2
      out_hidden_size: 4096
    # Inference Config
    torch_dtype: "bfloat16"
    device: "cuda"
    load_in_8bit: true
    batch_size: 8
    max_new_tokens: 512
    temperature: 0.7
    top_p: 0.95
    tasks: [1, 2, 3, 4]
    downloaded: true
    
  # =============================================
  # API 模型
  # =============================================
  gpt4o:
    name: "GPT-4o"
    api_type: "openai"
    model_name: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    # base_url_env: "OPENAI_BASE_URL"  # 可选，用于代理或自定义端点
    max_tokens: 512
    temperature: 0.7
    top_p: 0.95
    requests_per_minute: 50
    tasks: [1, 2, 3, 4]
    downloaded: false  # API 模型无需下载

  gpt5:
    name: "GPT-5"
    api_type: "openai"
    model_name: "gpt-5-2025-08-07"
    alias: "gpt-5"  # 可用别名
    api_key_env: "OPENAI_API_KEY"
    max_tokens: 512
    temperature: 0.1  # 较低温度保证一致性
    top_p: 0.95
    requests_per_minute: 50
    tasks: [1, 2, 3, 4]
    downloaded: false  # API 模型无需下载

# ===========================================
# Task 1: Zero-shot Classification
# ===========================================
task1_classification:
  enabled: true
  name: "Zero-shot Diagnosis Classification"
  metric: "accuracy"
  additional_metrics: ["f1_score", "auc"]
  
  # 使用 benchmark 子集（100样本）还是完整数据集
  use_benchmark_subset: true  # 设为 false 使用完整数据集
  
  datasets:
    PAD:
      data_dir: "MAKE_Downstreams/PAD"
      csv_file: "MAKE_PAD.csv"
      csv_file_benchmark: "MAKE_PAD_benchmark_100.csv"  # 110样本子集
      image_dir: "images"
      num_classes: 6
      num_samples: 2298
      num_samples_benchmark: 110  # 每类至少10个
      class_names:
        - "basal cell carcinoma"   # 37 samples in benchmark
        - "actinic keratosis"      # 32 samples in benchmark
        - "nevus"                  # 11 samples in benchmark
        - "seborrheic keratosis"   # 10 samples in benchmark
        - "squamous cell carcinoma" # 10 samples in benchmark (补齐)
        - "melanoma"               # 10 samples in benchmark (补齐)
      columns:
        image: "filename"
        label: "diag"
        split: "split"
        label_idx: "label"
      
    HAM10000:
      data_dir: "datasets/ham10000"
      csv_file: "HAM10000_metadata.csv"
      csv_file_benchmark: "HAM10000_benchmark_100.csv"  # 129样本子集
      image_dir: "images"
      num_classes: 7
      num_samples: 10015
      num_samples_benchmark: 129  # 每类至少10个
      class_names:
        - "nv"     # 67 samples in benchmark
        - "mel"    # 11 samples in benchmark
        - "bkl"    # 11 samples in benchmark
        - "bcc"    # 10 samples in benchmark (补齐)
        - "akiec"  # 10 samples in benchmark (补齐)
        - "vasc"   # 10 samples in benchmark (补齐)
        - "df"     # 10 samples in benchmark (补齐)
      class_full_names:
        nv: "Melanocytic nevi"
        mel: "Melanoma"
        bkl: "Benign keratosis-like lesions"
        bcc: "Basal cell carcinoma"
        akiec: "Actinic keratoses and intraepithelial carcinoma"
        vasc: "Vascular lesions"
        df: "Dermatofibroma"
      columns:
        image: "image_id"
        label: "dx"
        image_ext: ".jpg"  # 需要添加扩展名
  
  # MLLM Prompt Template
  prompt_template: |
    Based on the dermatological image, classify the skin condition.
    Provide your answer as a single disease name from the following list:
    {class_names}
    
    Answer:

# ===========================================
# Task 2: Concept Annotation
# ===========================================
task2_concept_annotation:
  enabled: true
  name: "Concept Annotation"
  metric: "accuracy"
  additional_metrics: ["auroc", "precision", "recall", "f1_score"]
  
  datasets:
    SkinCon:
      data_dir: "data/concept_annotation/skincon"
      image_dir: "final_images"
      meta_csv: "meta.csv"
      concept_list: "concept_list.txt"
      concept_terms_json: "concept_annotation/term_lists/ConceptTerms.json"
      num_concepts: 32
      concept_type: "clinical"
      
    Derm7pt:
      data_dir: "data/concept_annotation/derm7pt"
      image_dir: "final_images"
      meta_csv: "meta.csv"
      concept_list: "concept_list.txt"
      concept_terms_json: "concept_annotation/term_lists/ConceptTerms.json"
      num_concepts: 7
      concept_type: "dermoscopic"
  
  # MLLM Prompt Template
  prompt_template: |
    Analyze this dermatological image and identify the presence of the following clinical concepts:
    
    {concept_list}
    
    For each concept, answer "Yes" or "No":
    {concept_questions}
    
    Answer in JSON format:

# ===========================================
# Task 3: Image Captioning
# ===========================================
task3_captioning:
  enabled: true
  name: "Image Captioning"
  metric: "bleu"
  additional_metrics: ["rouge_l", "cider", "meteor", "bert_score"]
  
  datasets:
    SkinCap:
      data_dir: "data/captioning/skin_cap"
      csv_file: "skin_cap_meta.csv"
      image_dir: "images"
      caption_column: "caption_zh_polish_en"
      
    ISIC:
      data_dir: "data/captioning/isic_descriptions"
      csv_file: "isic_captions.csv"
      image_dir: "images"
      caption_column: "description"
  
  # Caption generation settings
  caption_generation:
    temperature: 0.7
    max_new_tokens: 256
    top_p: 0.9
    num_beams: 1  # 使用 beam search
    
  # MLLM Prompt Template
  prompt_template: |
    Generate a detailed medical description of the skin lesion in this image.
    Include the following aspects:
    1. Lesion type (e.g., macule, papule, nodule)
    2. Morphological features (size, shape, border clarity)
    3. Color characteristics and pigmentation distribution
    4. Surface features (smooth, scaly, ulcerated, etc.)
    5. Distribution pattern (solitary/multiple, symmetry)
    6. Clinical impression (possible diagnosis or differential diagnoses)
    
    Description:

# ===========================================
# Task 4: Visual Question Answering (VQA)
# ===========================================
task4_vqa:
  enabled: true
  name: "Visual Question Answering"
  metric: "accuracy"
  additional_metrics: ["exact_match", "f1_score"]
  
  datasets:
    PathVQA:
      data_dir: "data/vqa/pathvqa"
      questions_json: "questions.json"
      image_dir: "images"
      
    VQAMed:
      data_dir: "data/vqa/vqa_med"
      questions_json: "questions.json"
      image_dir: "images"
      
    DermVQA:
      data_dir: "data/vqa/derm_vqa"
      questions_json: "questions.json"
      image_dir: "images"
  
  # Question type classification
  question_types:
    - "detection"       # Is there...?
    - "classification"  # What type...?
    - "localization"    # Where is...?
    - "comparison"      # Is the lesion symmetric...?
    - "reasoning"       # What is the likely diagnosis...?
    - "counting"        # How many...?
  
  # VQA generation settings
  vqa_generation:
    temperature: 0.3  # 降低温度获得更确定的答案
    max_new_tokens: 128
    top_p: 0.95
    
  # MLLM Prompt Template
  prompt_template: |
    Question: {question}
    
    Please provide a concise and accurate answer based on the skin lesion image.
    
    Answer:

# ===========================================
# 评估设置
# ===========================================
evaluation:
  # 保存设置
  save_predictions: true
  save_intermediate_results: true
  save_error_cases: true
  max_error_cases: 50  # 每个模型最多保存的错误案例数
  
  # 可视化设置
  generate_plots: true
  plot_confusion_matrix: true
  plot_per_class_results: true
  
  # 统计设置
  compute_confidence_intervals: true
  confidence_level: 0.95
  
  # 报告设置
  generate_pdf_report: true
  generate_excel_summary: true

# ===========================================
# 数据预处理
# ===========================================
preprocessing:
  image_size: 224  # 图像大小
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    enabled: false  # 评估时通常不使用增强
    
# ===========================================
# 日志设置
# ===========================================
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_to_file: true
  log_to_console: true
  log_model_outputs: true
  log_gpu_memory: true

